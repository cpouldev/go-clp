name: Private ECHA cross-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: [self-hosted, echa-crosscheck]
    timeout-minutes: 10
    env:
      ECHA_ANNEX_VI_CSV: ${{ secrets.ECHA_ANNEX_VI_CSV }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Validate private input
        run: test -n "$ECHA_ANNEX_VI_CSV" && test -f "$ECHA_ANNEX_VI_CSV"
      - name: Compare with EUR-Lex ATP23
        run: go run ./cmd/annexvi-crosscheck -echa "$ECHA_ANNEX_VI_CSV"
